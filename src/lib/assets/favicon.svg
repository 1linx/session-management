<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70">
	<!-- Neo-brutalist clock: accent-yellow tile, hard black shadow, hands at 8:00 -->
	<rect x="10" y="10" width="56" height="56" fill="#14120f"/>
	<rect x="4" y="4" width="56" height="56" fill="#ffd23f" stroke="#14120f" stroke-width="4"/>
	<circle cx="32" cy="32" r="17" fill="#ffffff" stroke="#14120f" stroke-width="4"/>
	<!-- minute hand at 12 -->
	<line x1="32" y1="32" x2="32" y2="21" stroke="#14120f" stroke-width="4" stroke-linecap="square"/>
	<!-- hour hand at 8 -->
	<line x1="32" y1="32" x2="25" y2="36" stroke="#14120f" stroke-width="4" stroke-linecap="square"/>
	<circle cx="32" cy="32" r="2.5" fill="#14120f"/>
</svg>
